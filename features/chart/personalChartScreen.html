<!-- 내 재생 차트 화면. 통째로 된 페이지가 아니라 app.html 안쪽에 들어가는 조각이다.
     shared/js/router.js 가 주소가 바뀔 때 이 파일을 읽어서 #view 에 넣는다.
     내용은 features/chart/chart.js 가 Supabase 에서 받아와 채운다. -->
<section class="chart-head">
  <span class="chart-label">내 통계</span>
  <h1 class="chart-title">
    재생 차트 <span class="accent">TOP 100</span>
  </h1>
  <p class="chart-sub">지난 30일간 가장 많이 들은 노래</p>
</section>

<!-- TOP 3 시상대. 2위 1위 3위 순서로 놓인다. -->
<section class="podium" id="chart-podium" hidden></section>

<!-- 4위 ~ 100위 -->
<section class="chart-rest" id="chart-rest" hidden>
  <h3 class="section-title" id="chart-rest-title">4위 - 100위</h3>
  <div class="track-table" id="chart-table">
    <div class="table-head">
      <span class="col-rank">순위</span>
      <span class="col-title">곡</span>
      <span class="col-album">앨범</span>
      <span class="col-count">재생 수</span>
      <span class="col-time">🕘</span>
      <span class="col-like">♡</span>
    </div>
  </div>
</section>

<!-- 아직 들은 곡이 없을 때 -->
<p class="chart-empty" id="chart-empty" hidden>
  지난 30일 동안 들은 노래가 없어요. 검색해서 한 곡 틀어보세요.
</p>
