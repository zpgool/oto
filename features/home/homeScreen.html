<!-- 홈 화면. 통째로 된 페이지가 아니라 app.html 안쪽에 들어가는 조각이다.
     shared/js/router.js 가 주소가 바뀔 때 이 파일을 읽어서 #view 에 넣는다.
     그래서 이 파일을 브라우저로 직접 열면 디자인 없이 글자만 보인다. -->
<section class="greeting">
    <p class="greeting-sub">안녕하세요</p>
    <!-- 이름은 features/home/home.js 가 채운다 -->
    <h2 class="greeting-name" id="greeting-name"></h2>
</section>

<section class="shortcuts">
    <h3 class="section-title">바로 가기</h3>
    <!-- 카드는 features/home/home.js 가 채운다 -->
    <ul class="shortcut-grid" id="shortcut-grid"></ul>
</section>

<section class="playlists">
    <div class="section-head">
        <h3 class="section-title">플레이리스트</h3>
        <button type="button" class="btn-new-playlist">＋ 새 플레이리스트</button>
    </div>
    <!-- 목록은 features/home/home.js 가 Supabase 에서 받아와 채운다 -->
    <ul class="playlist-grid" id="playlist-grid"></ul>
    <p class="playlist-empty" id="playlist-empty" hidden>
        아직 플레이리스트가 없어요. ＋ 새 플레이리스트로 만들어보세요.
    </p>
</section>
