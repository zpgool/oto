<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oto.</title>
    <link rel="stylesheet" href="../../shared/css/reset.css" />
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="playlistScreen.css" />
</head>
  <body>
    <div class="app">
      <!-- ****** 사이드 바 ****** -->
      <!-- 사이드바: shared/partials/sidebar.html 을 shared/js/sidebar.js 가 여기에 넣는다 -->
      <div id="sidebar"></div>

      <!-- ******* 홈 메인 ****** -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-nav">
            <button type="button" aria-label="뒤로 가기">＜</button>
            <button type="button" aria-label="앞으로 가기">＞</button>
          </div>
        </header>

        <main class="content content-pl">
          <section class="pl-hero empty">
            <button type="button" class="pl-cover-empty" aria-label="커버 추가">
              ＋
            </button>
            <div class="pl-meta">
              <span class="pl-label">플레이리스트</span>
              <input
                type="text"
                class="pl-title-input"
                value="새 플레이리스트"
              />
              <span class="pl-sub">Jungwon · 0곡</span>
            </div>
          </section>

          <div class="pl-actions">
            <button
              type="button"
              class="btn-play-circle disabled"
              aria-label="재생"
            >
              ▶
            </button>
            <button type="button" class="btn-line">제목 편집</button>
            <button type="button" class="btn-line">＋ 노래 추가</button>
          </div>

          <!-- 빈 상태 -->
          <div class="empty-box">
            <p class="empty-title">아직 곡이 없어요</p>
            <p class="empty-desc">검색 화면에서 노래를 추가해보세요.</p>
          </div>
        </main>
      </div>

    </div>

    <!-- 플레이어 바: shared/partials/player.html 을 shared/js/player.js 가 여기에 넣는다 -->
    <div id="player"></div>

    <script type="module" src="../../shared/js/sidebar.js"></script>
    <script type="module" src="../../shared/js/player.js"></script>
</body>
</html>
