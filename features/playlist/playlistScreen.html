<!-- 플레이리스트 화면. 통째로 된 페이지가 아니라 app.html 안쪽에 들어가는 조각이다.
     shared/js/router.js 가 주소가 바뀔 때 이 파일을 읽어서 #view 에 넣는다.
     내용은 features/playlist/playlist.js 가 Supabase 에서 받아와 채운다. -->

<!-- 헤더 (그라데이션 배경) -->
<section class="pl-hero">
    <div class="pl-cover"></div>
    <div class="pl-meta">
        <span class="pl-label">플레이리스트</span>
        <h1 class="pl-title" id="pl-title"></h1>
        <span class="pl-sub" id="pl-sub"></span>
    </div>
</section>

<!-- 액션 버튼 -->
<div class="pl-actions">
    <button type="button" class="btn-play-circle" id="pl-play" aria-label="재생">▶</button>
    <button type="button" class="btn-line" id="pl-add-song">＋ 노래 추가</button>
    <button type="button" class="btn-line" id="pl-settings">설정</button>
</div>

<!-- 곡 테이블. 행은 playlist.js 가 만든다. -->
<div class="track-table" id="pl-table" hidden>
    <div class="table-head">
        <span class="col-drag"></span>
        <span class="col-num">#</span>
        <span class="col-title">제목</span>
        <span class="col-album">앨범</span>
        <span class="col-like">♡</span>
        <span class="col-del">×</span>
        <span class="col-time">🕘</span>
    </div>
</div>

<!-- 곡이 하나도 없을 때 -->
<div class="empty-box" id="pl-empty" hidden>
    <p class="empty-title">아직 곡이 없어요</p>
    <p class="empty-desc">검색 화면에서 노래를 추가해보세요.</p>
</div>
