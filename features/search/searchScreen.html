<!-- 검색 화면. 통째로 된 페이지가 아니라 app.html 안쪽에 들어가는 조각이다.
     shared/js/router.js 가 주소가 바뀔 때 이 파일을 읽어서 #view 에 넣는다.
     그래서 이 파일을 브라우저로 직접 열면 디자인 없이 글자만 보인다. -->
<h1 class="page-title">검색</h1>

<!-- 큰 검색 입력창 -->
<form class="search-big" id="search-form" role="search">
  <span class="search-big-icon">🔍</span>
  <input
    type="search"
    id="search-input"
    placeholder="노래, 아티스트, 앨범 입력"
    autocomplete="off"
  />
  <button type="button" class="search-clear" aria-label="지우기">
    ×
  </button>
</form>

<!-- (초기 상태) 최근 검색어 -->
<section class="recent-box" id="recent-box">
  <div class="section-head">
    <h3 class="section-title">최근 검색어</h3>
    <button type="button" class="btn-clear-recent" id="clear-recent">모두 삭제</button>
  </div>
  <!-- 최근 검색어 목록은 search.js 가 채운다 -->
  <ul class="recent-list" id="recent-list"></ul>
</section>

<!-- (결과 상태) 검색 결과 테이블 -->
<section class="result-box" id="result-box" hidden>
  <p class="result-summary" id="result-summary"></p>
  <div class="track-table" id="result-table">
    <!-- 헤더 행 -->
    <div class="table-head">
      <span class="col-num">#</span>
      <span class="col-title">제목</span>
      <span class="col-album">앨범</span>
      <span class="col-like">♡</span>
      <span class="col-add">+</span>
      <span class="col-time">🕘</span>
    </div>
  </div>
</section>
