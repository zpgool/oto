<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oto.</title>
    <link rel="stylesheet" href="../../shared/css/reset.css" />
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="searchScreen.css" />
</head>
  <body>
    <div class="app">
      <!-- ****** 사이드 바 ****** -->
      <!-- 사이드바: shared/partials/sidebar.html 을 shared/js/sidebar.js 가 여기에 넣는다 -->
      <div id="sidebar"></div>

      <!-- ******* 홈 메인 ****** -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-nav">
            <button type="button" aria-label="뒤로 가기">＜</button>
            <button type="button" aria-label="앞으로 가기">＞</button>
          </div>
        </header>

        <main class="content">
          <h1 class="page-title">검색</h1>

          <!-- 큰 검색 입력창 -->
          <form class="search-big" id="search-form" role="search">
            <span class="search-big-icon">🔍</span>
            <input
              type="search"
              id="search-input"
              placeholder="노래, 아티스트, 앨범 입력"
              autocomplete="off"
            />
            <button type="button" class="search-clear" aria-label="지우기">
              ×
            </button>
          </form>

          <!-- (초기 상태) 최근 검색어 -->
          <section class="recent-box" id="recent-box">
            <div class="section-head">
              <h3 class="section-title">최근 검색어</h3>
              <button type="button" class="btn-clear-recent" id="clear-recent">모두 삭제</button>
            </div>
            <!-- 최근 검색어 목록은 search.js 가 채운다 -->
            <ul class="recent-list" id="recent-list"></ul>
          </section>

          <!-- (결과 상태) 검색 결과 테이블 -->
          <section class="result-box" id="result-box" hidden>
            <p class="result-summary" id="result-summary"></p>
            <div class="track-table" id="result-table">
              <!-- 헤더 행 -->
              <div class="table-head">
                <span class="col-num">#</span>
                <span class="col-title">제목</span>
                <span class="col-album">앨범</span>
                <span class="col-like">♡</span>
                <span class="col-add">+</span>
                <span class="col-time">🕘</span>
              </div>
            </div>
          </section>
        </main>
      </div>

    </div>

    <!-- 플레이어 바: shared/partials/player.html 을 shared/js/player.js 가 여기에 넣는다 -->
    <div id="player"></div>

    <script type="module" src="../../shared/js/sidebar.js"></script>
    <script type="module" src="../../shared/js/player.js"></script>
    <script type="module" src="search.js"></script>
</body>
</html>
