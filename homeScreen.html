<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto.</title>
    <link rel="stylesheet" href="css/homeScreen.css">
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/reset.css" />
</head>
<body>
    <!-- 세션 확인 후 로그인 상태일 때만 보인다 (로그아웃 상태면 signIn.html 로 이동) -->
    <div id="home-view" class="app" hidden>
        <!-- ****** 사이드 바 ****** -->
        <!-- 사이드바: partials/sidebar.html 을 js/sidebar.js 가 여기에 넣는다 -->
        <div id="sidebar"></div>

        <!-- ******* 홈 메인 ****** -->
        <div class="main">
            <header class="topbar">
                <div class="topbar-nav">
                    <button type="button" aria-label="뒤로 가기">＜</button>
                    <button type="button" aria-label="앞으로 가기">＞</button>
                </div>
                <form class="search-form" id="search-form" role="search">
                    <input type="search" id="search-input" placeholder="노래 검색" autocomplete="off">
                </form>
                <button id="logout-button">로그아웃</button>
            </header>

            <main class="content">
                <!-- 검색 결과 (검색했을 때만 보인다) -->
                <section class="search-results" id="search-results" hidden>
                    <h3 class="section-title" id="search-result-title"></h3>
                    <ul class="track-list" id="search-result-list"></ul>
                </section>

                <section class="greeting">
                    <p class="greeting-sub">안녕하세요</p>
                    <h2 class="greeting-name">Jungwon.</h2>
                </section>

                <section class="shortcuts">
                    <h3 class="section-title">바로 가기</h3>
                    <ul class="shortcut-grid">
                        <li class="shortcut-card">
                            <a href="#">
                                <span class="shortcut-thumb favorite"></span>
                                <span class="shortcut-info">
                                    <span class="shortcut-name">즐겨찾기</span>
                                    <span class="shortcut-count">6곡</span>
                                </span>
                            </a>
                        </li>
                        <li class="shortcut-card">
                            <a href="#">
                                <span class="shortcut-thumb"></span>
                                <span class="shortcut-info">
                                    <span class="shortcut-name">BrUnOm4rs</span>
                                    <span class="shortcut-count">12곡</span>
                                </span>
                            </a>
                        </li>
                    </ul>
                </section>

                <section class="playlists">
                    <div class="section-head">
                        <h3 class="section-title">플레이리스트</h3>
                        <button type="button" class="btn-new-playlist">＋ 새 플레이리스트</button>
                    </div>
                    <ul class="playlist-grid" id="playlist-grid">
                        <li class="playlist-card">
                            <a href="#">
                                <span class="card-cover"></span>
                                <span class="card-title">BrUnOm4rs</span>
                                <span class="card-desc">12곡 · 37m</span>
                            </a>
                        </li>
                    </ul>
                </section>
            </main>
        </div>

        <!-- ****** 플레이어 바(하단) ****** -->
        <footer class="player">
            <div class="player-track">
                <span class="track-cover"></span>
                <span class="track-info">
                    <span class="track-title">Supernatural</span>
                    <span class="track-artist">NewJeans</span>
                </span>
                <button type="button" class="btn-like" aria-label="즐겨찾기">♥</button>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button type="button" aria-label="셔플">⇄</button>
                    <button type="button" aria-label="이전 곡">◀</button>
                    <button type="button" class="btn-play" aria-label="재생/일시정지">⏸</button>
                    <button type="button" aria-label="다음 곡">▶</button>
                    <button type="button" aria-label="반복">⟳</button>
                </div>
                <div class="progress">
                    <span class="time-current">1:26</span>
                    <input type="range" class="progress-bar" min="0" max="100" value="30" />
                    <span class="time-total">-3:26</span>
                </div>
            </div>

            <div class="player-extra">
                <button type="button" aria-label="재생 목록">☰</button>
                <button type="button" aria-label="음소거">🔈</button>
                <input type="range" class="volume-bar" min="0" max="100" value="70" />
            </div>
        </footer>
    </div>

    <div id="yt-player" style="display:none;"></div>

    <!-- <script src="js/app.js" type="module"></script> -->
    <script type="module" src="js/home.js"></script>
    <script type="module" src="js/search.js"></script>
  <script type="module" src="js/sidebar.js"></script>
</body>
</html>
