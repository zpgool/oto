<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oto - 인증 테스트</title>
</head>
<body>
    <h1>oto 인증 테스트</h1>

    <!-- 로그인 상태 -->
    <section id="status-section">
        <h2>현재 상태</h2>
        <p id="auth-status">확인 중...</p>
    </section>

    <hr>

    <!-- 로그아웃 상태일 때만 보이는 영역 -->
    <div id="logged-out-view" hidden>
        <section>
            <h2>회원가입</h2>
            <form id="signup-form">
                <label for="signup-email">이메일</label>
                <input type="email" id="signup-email" name="email" autocomplete="email" required>
                <br>
                <label for="signup-password">비밀번호</label>
                <input type="password" id="signup-password" name="password" autocomplete="new-password" minlength="6" required>
                <br>
                <button type="submit">회원가입</button>
            </form>
        </section>

        <hr>

        <section>
            <h2>로그인</h2>
            <form id="login-form">
                <label for="login-email">이메일</label>
                <input type="email" id="login-email" name="email" autocomplete="email" required>
                <br>
                <label for="login-password">비밀번호</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                <br>
                <button type="submit">로그인</button>
            </form>
        </section>
    </div>

    <!-- 로그인 상태일 때만 보이는 영역 -->
    <div id="logged-in-view" hidden>
        <section>
            <h2>내 계정</h2>
            <p>이메일: <span id="user-email"></span></p>
            <p>유저 ID: <span id="user-id"></span></p>
            <button type="button" id="logout-button">로그아웃</button>
        </section>
    </div>

    <hr>

    <!-- 결과 / 에러 메시지 -->
    <section>
        <h2>메시지</h2>
        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
