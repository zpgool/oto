<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oto.</title>
    <link rel="stylesheet" href="css/homeScreen.css" />
  </head>
  <body>
    <div class="app">
      <!-- ****** 사이드 바 ****** -->
      <aside class="sidebar">
        <div class="logo">
          <span class="logo-mark"></span>
          <h1>Oto.</h1>
        </div>

        <nav class="nav-main">
          <ul>
            <li><a href="#" class="active">홈</a></li>
            <li><a href="#">검색</a></li>
            <li><a href="#">즐겨찾기</a></li>
            <li><a href="#">내 재생 차트</a></li>
          </ul>
        </nav>

        <div class="nav-playlist">
          <div class="nav-playlist-head">
            <span>내 플레이리스트</span>
            <button
              type="button"
              class="btn-add-playlist"
              aria-label="플레이리스트 추가"
            >
              +
            </button>
          </div>
          <ul id="playlist-list">
            <li>
              <a href="#">
                <span class="pl-thumb"></span>
                <span class="pl-info">
                  <span class="pl-name">BrUnOm4rs</span>
                  <span class="pl-count">12곡</span>
                </span>
              </a>
            </li>
          </ul>
        </div>

        <div class="user-profile">
          <span class="user-avatar"></span>
          <span class="user-info">
            <span class="user-name">Jungwon</span>
            <span class="user-email">Jungwon@oto.com</span>
          </span>
        </div>
      </aside>

      <!-- ******* 홈 메인 ****** -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-nav">
            <button type="button" aria-label="뒤로 가기">＜</button>
            <button type="button" aria-label="앞으로 가기">＞</button>
          </div>
          <form class="search-form" role="search">
            <input type="search" id="search-input" placeholder="노래 검색" />
          </form>
        </header>

        <main class="content">
          <h1 class="page-title">검색</h1>

          <!-- 큰 검색 입력창 -->
          <form class="search-big" role="search">
            <span class="search-big-icon">🔍</span>
            <input
              type="search"
              id="search-input"
              placeholder="노래, 아티스트, 앨범 입력"
            />
            <button type="button" class="search-clear" aria-label="지우기">
              ×
            </button>
          </form>

          <!-- (초기 상태) 최근 검색어 -->
          <section class="recent-box">
            <div class="section-head">
              <h3 class="section-title">최근 검색어</h3>
              <button type="button" class="btn-clear-recent">모두 삭제</button>
            </div>
            <ul class="recent-list">
              <li class="recent-item">
                <span class="recent-text">NewJeans</span>
                <button type="button" class="recent-del" aria-label="삭제">
                  ×
                </button>
              </li>
              <li class="recent-item">
                <span class="recent-text">Frank Ocean</span>
                <button type="button" class="recent-del" aria-label="삭제">
                  ×
                </button>
              </li>
              <li class="recent-item">
                <span class="recent-text">IU</span>
                <button type="button" class="recent-del" aria-label="삭제">
                  ×
                </button>
              </li>
            </ul>
          </section>

          <!-- (결과 상태) 검색 결과 테이블 -->
          <section class="result-box" hidden>
            <p class="result-summary"><strong>"new"</strong> 검색 결과 · 1곡</p>
            <div class="track-table">
              <!-- 헤더 행 -->
              <div class="table-head">
                <span class="col-num">#</span>
                <span class="col-title">제목</span>
                <span class="col-album">앨범</span>
                <span class="col-like">♡</span>
                <span class="col-add">+</span>
                <span class="col-time">🕘</span>
              </div>
              <!-- 결과 행 -->
              <div class="table-row">
                <span class="col-num"><span class="eq-icon">▮▮</span></span>
                <span class="col-title">
                  <span class="row-thumb"></span>
                  <span class="row-info">
                    <span class="row-name">Supernatural</span>
                    <span class="row-artist">NewJeans</span>
                  </span>
                </span>
                <span class="col-album">Supernatural</span>
                <button class="col-like liked" aria-label="즐겨찾기">♥</button>
                <button class="col-add" aria-label="추가">+</button>
                <span class="col-time">3:26</span>
              </div>
            </div>
          </section>
        </main>
      </div>

      <!-- ****** 플레이어 바(하단) ****** -->
      <footer class="player">
        <div class="player-track">
          <span class="track-cover"></span>
          <span class="track-info">
            <span class="track-title">Supernatural</span>
            <span class="track-artist">NewJeans</span>
          </span>
          <button type="button" class="btn-like" aria-label="즐겨찾기">
            ♥
          </button>
        </div>

        <div class="player-controls">
          <div class="control-buttons">
            <button type="button" aria-label="셔플">⇄</button>
            <button type="button" aria-label="이전 곡">◀</button>
            <button type="button" class="btn-play" aria-label="재생/일시정지">
              ⏸
            </button>
            <button type="button" aria-label="다음 곡">▶</button>
            <button type="button" aria-label="반복">⟳</button>
          </div>
          <div class="progress">
            <span class="time-current">1:26</span>
            <input
              type="range"
              class="progress-bar"
              min="0"
              max="100"
              value="30"
            />
            <span class="time-total">-3:26</span>
          </div>
        </div>

        <div class="player-extra">
          <button type="button" aria-label="재생 목록">☰</button>
          <button type="button" aria-label="음소거">🔈</button>
          <input type="range" class="volume-bar" min="0" max="100" value="70" />
        </div>
      </footer>
    </div>

    <div id="yt-player" style="display: none"></div>

    <!-- <script src="js/app.js" type="module"></script> -->
  </body>
</html>
