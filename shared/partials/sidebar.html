<!-- 모든 페이지가 같이 쓰는 사이드바. shared/js/sidebar.js 가 각 페이지의 #sidebar 자리에 넣는다. -->
<aside class="sidebar">
    <div class="logo">
        <span class="logo-mark"></span>
        <h1>Oto.</h1>
    </div>

    <nav class="nav-main">
        <ul>
            <li><a href="#/home">홈</a></li>
            <li><a href="#/search">검색</a></li>
            <!-- 즐겨찾기는 아직 화면이 없어서 눌러도 넘어가지 않는다 -->
            <li><a href="#" aria-disabled="true">즐겨찾기</a></li>
            <li><a href="#/chart">내 재생 차트</a></li>
        </ul>
    </nav>

    <div class="nav-playlist">
        <div class="nav-playlist-head">
            <span>내 플레이리스트</span>
            <button type="button" class="btn-add-playlist" aria-label="플레이리스트 추가">+</button>
        </div>
        <!-- 목록은 shared/js/sidebar.js 가 Supabase 에서 받아와 채운다 -->
        <ul id="playlist-list"></ul>
    </div>

    <!-- 이름/이메일은 shared/js/sidebar.js 가 로그인한 사용자 정보로 채운다 -->
    <div class="user-profile">
        <span class="user-avatar"></span>
        <span class="user-info">
            <span class="user-name" id="user-name"></span>
            <span class="user-email" id="user-email"></span>
        </span>
    </div>
</aside>
